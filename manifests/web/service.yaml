# Selects ALL "app: web" pods (primary + canary), so live traffic is split
# between the variants in proportion to their pod counts.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
