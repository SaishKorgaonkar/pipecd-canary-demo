apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app: web
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: web
      pipecd.dev/variant: primary
  template:
    metadata:
      labels:
        app: web
        pipecd.dev/variant: primary
    spec:
      containers:
        - name: web
          # Change this tag in Git to release a new version. PipeCD does the rest.
          image: demo-web:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
